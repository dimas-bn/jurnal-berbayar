<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jurnal Mengajar Online - Masuk / Daftar</title>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E2B22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans', Arial, sans-serif;
    background: #F6F2E4;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #D8CDB0;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(30,43,34,0.08);
    padding: 34px 30px;
    width: 100%;
    max-width: 380px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    color: #1E2B22;
    font-size: 25px;
    margin: 0 0 6px;
    text-align: center;
  }
  p.subtitle {
    color: #5C5240;
    font-size: 14.5px;
    line-height: 1.5;
    text-align: center;
    margin: 0 0 26px;
  }
  .tabs {
    display: flex;
    margin-bottom: 22px;
    border-radius: 9px;
    overflow: hidden;
    border: 1px solid #D8CDB0;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 11px;
    cursor: pointer;
    background: #F6F2E4;
    color: #5C5240;
    font-weight: 600;
    font-size: 14.5px;
  }
  .tab.active {
    background: #1E2B22;
    color: #F6F2E4;
  }
  label {
    display: block;
    font-size: 13.5px;
    color: #3E3A2E;
    font-weight: 600;
    margin-bottom: 5px;
    margin-top: 15px;
  }
  input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid #D8CDB0;
    border-radius: 7px;
    font-size: 15px;
    font-family: 'IBM Plex Sans', Arial, sans-serif;
    color: #1E2B22;
  }
  input:focus {
    outline: none;
    border-color: #A6493C;
  }
  button.submit {
    width: 100%;
    margin-top: 24px;
    padding: 13px;
    background: #1E2B22;
    color: #F6F2E4;
    border: none;
    border-radius: 7px;
    font-weight: 700;
    font-size: 15.5px;
    cursor: pointer;
    font-family: 'IBM Plex Sans', Arial, sans-serif;
  }
  button.submit:disabled {
    background: #A79E88;
    cursor: not-allowed;
  }
  .pesan {
    margin-top: 16px;
    font-size: 13.5px;
    line-height: 1.5;
    text-align: center;
    padding: 11px;
    border-radius: 7px;
    display: none;
  }
  .pesan.error { background: #F5E3DF; color: #8F3D2D; display: block; }
  .pesan.sukses { background: #E6EEE6; color: #1E2B22; display: block; }
  .form-section { display: none; }
  .form-section.active { display: block; }
</style>
</head>
<body>

<div class="card">
  <img src="/icon-192.png" alt="Jurnal Mengajar" style="width:56px; height:56px; border-radius:14px; display:block; margin:0 auto 12px;">
  <h1>Jurnal Mengajar Online</h1>
  <p class="subtitle">Masuk atau daftar untuk mulai mencatat jurnal mengajar Anda</p>

  <div class="tabs">
    <div class="tab active" id="tabMasuk" onclick="gantiTab('masuk')">Masuk</div>
    <div class="tab" id="tabDaftar" onclick="gantiTab('daftar')">Daftar</div>
  </div>

  <!-- FORM MASUK -->
  <div id="formMasuk" class="form-section active">
    <label for="emailMasuk">Email</label>
    <input type="email" id="emailMasuk" placeholder="nama@email.com">
    <label for="passMasuk">Password</label>
    <input type="password" id="passMasuk" placeholder="Masukkan password">
    <button class="submit" onclick="prosesMasuk()">Masuk</button>
  </div>

  <!-- FORM DAFTAR -->
  <div id="formDaftar" class="form-section">
    <label for="namaDaftar">Nama Lengkap</label>
    <input type="text" id="namaDaftar" placeholder="Nama Anda">
    <label for="emailDaftar">Email</label>
    <input type="email" id="emailDaftar" placeholder="nama@email.com">
    <label for="passDaftar">Buat Password</label>
    <input type="password" id="passDaftar" placeholder="Minimal 6 karakter">
    <button class="submit" onclick="prosesDaftar()">Daftar Sekarang</button>
  </div>

  <div id="pesan" class="pesan"></div>
</div>

<script>
  // ==== KONFIGURASI SUPABASE (sudah diisi otomatis) ====
  const SUPABASE_URL = "https://eziszpzxszxurvqcsikj.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6aXN6cHp4c3p4dXJ2cWNzaWtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNjMzNTYsImV4cCI6MjEwMTgzOTM1Nn0.q9YdOK9ph_WqDYhPfNVTqTVdKuMPLPFLicLBsOg5ivQ";

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Kalau sudah pernah login sebelumnya, langsung ke dashboard
  (async () => {
    const { data: { session } } = await db.auth.getSession();
    if (session) window.location.href = "dashboard.html";
  })();

  function gantiTab(tab) {
    document.getElementById('tabMasuk').classList.toggle('active', tab === 'masuk');
    document.getElementById('tabDaftar').classList.toggle('active', tab === 'daftar');
    document.getElementById('formMasuk').classList.toggle('active', tab === 'masuk');
    document.getElementById('formDaftar').classList.toggle('active', tab === 'daftar');
    sembunyikanPesan();
  }

  function tampilkanPesan(teks, jenis) {
    const el = document.getElementById('pesan');
    el.textContent = teks;
    el.className = 'pesan ' + jenis;
  }

  function sembunyikanPesan() {
    const el = document.getElementById('pesan');
    el.className = 'pesan';
    el.textContent = '';
  }

  function terjemahkanError(pesanAsli) {
    const kamus = {
      'Email not confirmed': 'Email belum terkonfirmasi. Cek inbox/spam email Anda dan klik link konfirmasinya terlebih dahulu.',
      'Invalid login credentials': 'Email atau password salah.',
      'User already registered': 'Email ini sudah terdaftar. Coba masuk lewat tab Masuk.',
      'Password should be at least 6 characters': 'Password minimal 6 karakter.',
      'Unable to validate email address: invalid format': 'Format email tidak valid.',
      'For security purposes, you can only request this after': 'Terlalu banyak percobaan. Mohon tunggu sebentar lalu coba lagi.',
      'Email address': 'Alamat email tidak valid.',
      'Signup requires a valid password': 'Password wajib diisi dengan benar.',
      'Anonymous sign-ins are disabled': 'Metode masuk ini tidak diaktifkan.',
      'User not found': 'Akun dengan email ini tidak ditemukan.',
      'Email rate limit exceeded': 'Terlalu banyak permintaan email. Mohon tunggu beberapa saat lalu coba lagi.',
      'Token has expired or is invalid': 'Link/kode ini sudah kedaluwarsa atau tidak valid. Coba ulangi prosesnya dari awal.',
      'New password should be different from the old password': 'Password baru harus berbeda dari password lama.',
      'Failed to fetch': 'Gagal terhubung ke server. Periksa koneksi internet Anda.',
      'network': 'Gagal terhubung ke server. Periksa koneksi internet Anda.'
    };
    for (const kunci in kamus) {
      if (pesanAsli.includes(kunci)) return kamus[kunci];
    }
    return pesanAsli;
  }

  async function prosesDaftar() {
    const nama = document.getElementById('namaDaftar').value.trim();
    const email = document.getElementById('emailDaftar').value.trim();
    const pass = document.getElementById('passDaftar').value;

    if (!nama || !email || !pass) {
      tampilkanPesan('Mohon lengkapi semua data.', 'error');
      return;
    }
    if (pass.length < 6) {
      tampilkanPesan('Password minimal 6 karakter.', 'error');
      return;
    }

    tampilkanPesan('Memproses pendaftaran...', 'sukses');

    const { data, error } = await db.auth.signUp({
      email: email,
      password: pass,
      options: {
        data: { nama_lengkap: nama }
      }
    });

    if (error) {
      tampilkanPesan('Gagal daftar: ' + terjemahkanError(error.message), 'error');
      return;
    }

    tampilkanPesan('Pendaftaran berhasil! Silakan cek email untuk verifikasi, lalu masuk lewat tab Masuk.', 'sukses');
  }

  async function prosesMasuk() {
    const email = document.getElementById('emailMasuk').value.trim();
    const pass = document.getElementById('passMasuk').value;

    if (!email || !pass) {
      tampilkanPesan('Mohon isi email dan password.', 'error');
      return;
    }

    tampilkanPesan('Memproses...', 'sukses');

    const { data, error } = await db.auth.signInWithPassword({
      email: email,
      password: pass
    });

    if (error) {
      tampilkanPesan('Gagal masuk: ' + terjemahkanError(error.message), 'error');
      return;
    }

    tampilkanPesan('Berhasil masuk! Mengarahkan ke dashboard...', 'sukses');
    window.location.href = "dashboard.html";
  }
</script>

</body>
</html>
