<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buat Password Baru - Jurnal Mengajar Online</title>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E2B22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans', Arial, sans-serif;
    background: #F6F2E4;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #D8CDB0;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(30,43,34,0.08);
    padding: 34px 30px;
    width: 100%;
    max-width: 380px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    color: #1E2B22;
    font-size: 24px;
    margin: 0 0 6px;
    text-align: center;
  }
  p.subtitle {
    color: #5C5240;
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1.5;
    text-align: center;
    margin: 0 0 26px;
  }
  label {
    display: block;
    font-size: 13.5px;
    color: #3E3A2E;
    font-weight: 600;
    margin-bottom: 5px;
    margin-top: 15px;
  }
  input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid #D8CDB0;
    border-radius: 7px;
    font-size: 15px;
    font-family: 'IBM Plex Sans', Arial, sans-serif;
    color: #1E2B22;
  }
  input:focus {
    outline: none;
    border-color: #A6493C;
  }
  .pass-wrap { position: relative; }
  .pass-wrap input { padding-right: 44px; }
  .toggle-pass {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 17px;
    padding: 8px;
    cursor: pointer;
    line-height: 1;
    opacity: 0.8;
  }
  .toggle-pass:hover { opacity: 0.9; }
  button.submit {
    width: 100%;
    margin-top: 24px;
    padding: 13px;
    background: #1E2B22;
    color: #F6F2E4;
    border: none;
    border-radius: 7px;
    font-weight: 700;
    font-size: 15.5px;
    cursor: pointer;
    font-family: 'IBM Plex Sans', Arial, sans-serif;
  }
  button.submit:disabled {
    background: #A79E88;
    cursor: not-allowed;
  }
  .pesan {
    margin-top: 16px;
    font-size: 13.5px;
    line-height: 1.5;
    text-align: center;
    padding: 11px;
    border-radius: 7px;
    display: none;
  }
  .pesan.error { background: #F5E3DF; color: #8F3D2D; display: block; }
  .pesan.sukses { background: #E6EEE6; color: #1E2B22; display: block; }
  .link-kembali {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13.5px;
    font-weight: 500;
    color: #5C5240;
    text-decoration: none;
  }
  .link-kembali:hover { color: #1E2B22; text-decoration: underline; }
  .form-wrap { display: none; }
  .form-wrap.active { display: block; }
</style>
</head>
<body>

<div class="card">
  <img src="/icon-192.png" alt="Jurnal Mengajar" style="width:56px; height:56px; border-radius:14px; display:block; margin:0 auto 12px;">
  <h1>Buat Password Baru</h1>
  <p class="subtitle" id="subtitleText">Memeriksa link reset password Anda...</p>

  <!-- FORM PASSWORD BARU -->
  <div id="formReset" class="form-wrap">
    <label for="passBaru">Password Baru</label>
    <div class="pass-wrap">
      <input type="password" id="passBaru" placeholder="Minimal 6 karakter">
      <button type="button" class="toggle-pass" data-target="passBaru" aria-label="Tampilkan password">👁️</button>
    </div>
    <label for="passUlangi">Ulangi Password Baru</label>
    <div class="pass-wrap">
      <input type="password" id="passUlangi" placeholder="Ketik ulang password baru">
      <button type="button" class="toggle-pass" data-target="passUlangi" aria-label="Tampilkan password">👁️</button>
    </div>
    <button class="submit" onclick="prosesGantiPassword()">Simpan Password Baru</button>
  </div>

  <!-- STATE LINK TIDAK VALID -->
  <div id="formInvalid" class="form-wrap">
    <a class="link-kembali" href="index.html" style="margin-top:0;">← Kembali ke halaman Masuk untuk minta link baru</a>
  </div>

  <div id="pesan" class="pesan"></div>
</div>

<script>
  const SUPABASE_URL = "https://eziszpzxszxurvqcsikj.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6aXN6cHp4c3p4dXJ2cWNzaWtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNjMzNTYsImV4cCI6MjEwMTgzOTM1Nn0.q9YdOK9ph_WqDYhPfNVTqTVdKuMPLPFLicLBsOg5ivQ";

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let sesiPemulihanValid = false;

  document.querySelectorAll('.toggle-pass').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const tampil = input.type === 'text';
      input.type = tampil ? 'password' : 'text';
      btn.textContent = tampil ? '👁️' : '🙈';
      btn.setAttribute('aria-label', tampil ? 'Tampilkan password' : 'Sembunyikan password');
    });
  });

  function tampilkanPesan(teks, jenis) {
    const el = document.getElementById('pesan');
    el.textContent = teks;
    el.className = 'pesan ' + jenis;
  }

  function sembunyikanPesan() {
    const el = document.getElementById('pesan');
    el.className = 'pesan';
    el.textContent = '';
  }

  function terjemahkanError(pesanAsli) {
    const kamus = {
      'Password should be at least 6 characters': 'Password minimal 6 karakter.',
      'New password should be different from the old password': 'Password baru harus berbeda dari password lama.',
      'Token has expired or is invalid': 'Link ini sudah kedaluwarsa atau tidak valid. Silakan minta link reset baru.',
      'Auth session missing': 'Link ini sudah kedaluwarsa atau tidak valid. Silakan minta link reset baru.',
      'Failed to fetch': 'Gagal terhubung ke server. Periksa koneksi internet Anda.',
      'network': 'Gagal terhubung ke server. Periksa koneksi internet Anda.'
    };
    for (const kunci in kamus) {
      if (pesanAsli.includes(kunci)) return kamus[kunci];
    }
    return pesanAsli;
  }

  function tampilkanFormInvalid() {
    document.getElementById('subtitleText').textContent = 'Link reset password ini sudah tidak berlaku.';
    document.getElementById('formReset').classList.remove('active');
    document.getElementById('formInvalid').classList.add('active');
  }

  // Saat halaman ini dibuka dari link email, Supabase otomatis mendeteksi
  // token pemulihan dari URL dan memicu event PASSWORD_RECOVERY di bawah ini.
  db.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session) {
      sesiPemulihanValid = true;
      document.getElementById('subtitleText').textContent = 'Silakan buat password baru untuk akun Anda';
      document.getElementById('formReset').classList.add('active');
    }
  });

  // Jaga-jaga: kalau setelah beberapa saat event di atas tidak terpicu
  // (link kedaluwarsa/rusak/dibuka bukan dari email), tampilkan pesan link tidak valid.
  setTimeout(() => {
    if (!sesiPemulihanValid) tampilkanFormInvalid();
  }, 3000);

  async function prosesGantiPassword() {
    const pass = document.getElementById('passBaru').value;
    const passUlangi = document.getElementById('passUlangi').value;

    if (!pass || !passUlangi) {
      tampilkanPesan('Mohon isi kedua kolom password.', 'error');
      return;
    }
    if (pass.length < 6) {
      tampilkanPesan('Password minimal 6 karakter.', 'error');
      return;
    }
    if (pass !== passUlangi) {
      tampilkanPesan('Password dan ulangi password tidak sama.', 'error');
      return;
    }

    tampilkanPesan('Menyimpan password baru...', 'sukses');

    const { error } = await db.auth.updateUser({ password: pass });

    if (error) {
      tampilkanPesan('Gagal menyimpan: ' + terjemahkanError(error.message), 'error');
      return;
    }

    tampilkanPesan('Password berhasil diganti! Mengarahkan ke halaman Masuk...', 'sukses');
    await db.auth.signOut();
    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
  }
</script>

</body>
</html>
