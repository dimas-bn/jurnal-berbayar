<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papan Poin — Jurnal Mengajar Online</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1E2B22; --paper: #F6F2E4; --margin: #A6493C;
    --accent-dark: #3E6B52; --gold: #C9A227;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ink); color: var(--paper);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh; padding: 32px 20px 60px;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 36px; }
  .eyebrow { color: #8FA894; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin: 0 0 8px; }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 700; font-style: italic;
    font-size: clamp(28px, 5vw, 46px); margin: 0; color: var(--paper);
  }
  .sub { color: #B7C6BA; font-size: 14px; margin-top: 10px; }

  .status { text-align: center; padding: 60px 20px; color: #B7C6BA; font-size: 16px; }
  .status.error { color: #E29088; }

  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 14px; margin: 30px 0 40px; }
  .podium-item { text-align: center; width: 130px; }
  .podium-rank { font-family: 'Fraunces', serif; font-weight: 700; font-size: 15px; color: var(--gold); }
  .podium-box {
    background: #26362B; border: 1px solid #3A4A3E; border-radius: 10px 10px 0 0;
    padding: 14px 8px; margin-top: 8px;
  }
  .podium-item.p1 .podium-box { padding-top: 26px; border-color: var(--gold); }
  .podium-name { font-size: 13.5px; font-weight: 600; line-height: 1.3; min-height: 34px; }
  .podium-poin { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 700; margin-top: 6px; color: var(--gold); }
  .podium-item.p1 .podium-poin { font-size: 30px; }

  .list { background: #26362B; border-radius: 12px; overflow: hidden; border: 1px solid #3A4A3E; }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 18px; border-bottom: 1px solid #33453A; font-size: 15px;
  }
  .row:last-child { border-bottom: none; }
  .rank { width: 28px; text-align: center; color: #8FA894; font-weight: 600; font-size: 13px; }
  .nama { flex: 1; }
  .presensi { color: #8FA894; font-size: 12px; margin-right: 6px; }
  .poin { font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; color: var(--paper); }

  footer { text-align: center; margin-top: 40px; color: #6E8073; font-size: 12px; }
  .refresh-note { text-align: center; color: #6E8073; font-size: 12px; margin-top: 14px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">Papan Poin Online</p>
    <h1 id="namaKelas">Memuat…</h1>
    <p class="sub" id="subInfo"></p>
  </header>

  <div id="konten">
    <div class="status" id="statusMsg">Memuat data papan poin…</div>
  </div>

  <p class="refresh-note" id="refreshNote"></p>
  <footer>Jurnal Mengajar Online</footer>
</div>

<script>
  const SUPABASE_URL = "https://eziszpzxszxurvqcsikj.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6aXN6cHp4c3p4dXJ2cWNzaWtqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNjMzNTYsImV4cCI6MjEwMTgzOTM1Nn0.q9YdOK9ph_WqDYhPfNVTqTVdKuMPLPFLicLBsOg5ivQ";
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  const token = params.get('k');

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  async function muatPapanPoin() {
    if (!token) {
      document.getElementById('namaKelas').textContent = 'Link tidak valid';
      document.getElementById('statusMsg').textContent = 'Link papan poin ini tidak lengkap. Minta link yang benar dari guru Anda.';
      document.getElementById('statusMsg').classList.add('error');
      return;
    }

    const { data: namaKelas, error: errNama } = await db.rpc('get_nama_kelas_publik', { p_token: token });
    if (errNama || !namaKelas) {
      document.getElementById('namaKelas').textContent = 'Kelas tidak ditemukan';
      document.getElementById('statusMsg').textContent = 'Link papan poin ini sudah tidak berlaku.';
      document.getElementById('statusMsg').classList.add('error');
      return;
    }
    document.getElementById('namaKelas').textContent = namaKelas;

    const { data: daftar, error } = await db.rpc('get_papan_poin_publik', { p_token: token });
    if (error) {
      document.getElementById('statusMsg').textContent = 'Gagal memuat data: ' + error.message;
      document.getElementById('statusMsg').classList.add('error');
      return;
    }

    if (!daftar || !daftar.length) {
      document.getElementById('konten').innerHTML = '<div class="status">Belum ada siswa terdaftar di kelas ini.</div>';
      return;
    }

    const totalPertemuan = daftar[0].total_pertemuan || 0;
    document.getElementById('subInfo').textContent = totalPertemuan > 0
      ? `Rata-rata poin dari ${totalPertemuan} pertemuan`
      : 'Belum ada pertemuan tercatat — semua siswa di poin awal';

    const sorted = daftar.slice().sort((a, b) => b.rata_poin - a.rata_poin);
    const top3 = sorted.slice(0, 3);
    const sisanya = sorted.slice(3);

    let html = '';

    if (top3.length === 3) {
      const [p1, p2, p3] = top3;
      html += `<div class="podium">
        <div class="podium-item p2"><div class="podium-rank">#2</div><div class="podium-box"><div class="podium-name">${escapeHtml(p2.nama_siswa)}</div><div class="podium-poin">${p2.rata_poin}</div></div></div>
        <div class="podium-item p1"><div class="podium-rank">#1 🏆</div><div class="podium-box"><div class="podium-name">${escapeHtml(p1.nama_siswa)}</div><div class="podium-poin">${p1.rata_poin}</div></div></div>
        <div class="podium-item p3"><div class="podium-rank">#3</div><div class="podium-box"><div class="podium-name">${escapeHtml(p3.nama_siswa)}</div><div class="podium-poin">${p3.rata_poin}</div></div></div>
      </div>`;
    }

    const daftarSisa = top3.length === 3 ? sisanya : sorted;
    const offsetRank = top3.length === 3 ? 4 : 1;

    if (daftarSisa.length) {
      html += '<div class="list">' + daftarSisa.map((s, i) => `
        <div class="row">
          <span class="rank">#${i + offsetRank}</span>
          <span class="nama"><span class="presensi">${s.nomor_presensi ?? ''}</span>${escapeHtml(s.nama_siswa)}</span>
          <span class="poin">${s.rata_poin}</span>
        </div>`).join('') + '</div>';
    }

    document.getElementById('konten').innerHTML = html;
    document.getElementById('refreshNote').textContent = 'Diperbarui otomatis setiap 30 detik — ' + new Date().toLocaleTimeString('id-ID');
  }

  muatPapanPoin();
  setInterval(muatPapanPoin, 30000);
</script>

</body>
</html>
